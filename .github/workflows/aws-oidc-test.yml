
name: AWS OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-authentication:
    name: Authenticate with AWS
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsOIDCTest

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Terraform backend access
        run: |
          echo "Checking S3 backend bucket..."
          aws s3api head-bucket \
            --bucket nsailaja-terraform-state-2026-12345

          echo "Checking DynamoDB lock table..."
          aws dynamodb describe-table \
            --table-name terraform-state-lock \
            --region ap-south-1

          echo "Backend access verification completed."

