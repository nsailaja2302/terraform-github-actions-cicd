
name: Terraform CD Plan

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Step 3: Configure AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraformPlan

      # Step 4: Prepare Terraform variables
      - name: Prepare Terraform variables
        run: cp terraform.tfvars.example terraform.tfvars

      # Step 5: Initialize Terraform and remote backend
      - name: Terraform Init
        run: terraform init

      # Step 6: Validate configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Generate Terraform plan
      - name: Terraform Plan
        run: terraform plan -no-color
