
name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:

    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      # Step 1: Download repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Step 3: Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Step 4: Initialize Terraform without AWS backend
      - name: Terraform Init
        run: terraform init -backend=false

      # Step 5: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 6: Collect validation artifact
      - name: Upload Terraform Lock File
        uses: actions/upload-artifact@v4
        with:
          name: terraform-lock-file
          path: terraform/.terraform.lock.hcl
          if-no-files-found: error
          retention-days: 7
